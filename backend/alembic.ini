# ---------------------------------------------------------------------------
# Alembic Configuration
# Investment OS
# ---------------------------------------------------------------------------

[alembic]

# Location of Alembic scripts
script_location = alembic

# Add project root to Python path
prepend_sys_path = .

# File naming convention for new revisions
file_template = %%(rev)s_%%(slug)s

# Timezone used for revision timestamps
timezone = UTC

# Version locations
version_locations = alembic/versions

# Use operating-system path separator
version_path_separator = os

# Generate revisions recursively
recursive_version_locations = false

# ---------------------------------------------------------------------------
# Database URL
#
# NOTE:
# This value is intentionally left blank.
# The URL is loaded dynamically from app configuration in alembic/env.py.
# ---------------------------------------------------------------------------

sqlalchemy.url =

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
