[project]
name = "investment-os-backend"
version = "0.1.0"
description = "AI-assisted Investment Operating System Backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Dinesh Annayya <dinesh.annayya@gmail.com>" }
]

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",

    "sqlalchemy>=2.0.40",
    "alembic>=1.16.0",
    "psycopg[binary]>=3.2.0",

    "redis>=6.2.0",

    "python-dotenv>=1.1.0",
   
    "PyJWT>=2.10",

    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.2.0",

    "alembic>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "httpx>=0.28.0",

    "ruff>=0.12.0",
    "black>=25.1.0",
    "mypy>=1.17.0",

    "pre-commit>=4.2.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"

warn_return_any = true
warn_unused_configs = true

disallow_untyped_defs = true
check_untyped_defs = true

strict_optional = true

plugins = []
