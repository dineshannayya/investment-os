name: investment-os

services:

  ###########################################################
  # PostgreSQL
  ###########################################################
  postgres:
    hostname: postgres
    image: postgres:17
    container_name: investment-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - investment-network


  ###########################################################
  # Redis
  ###########################################################
  redis:

    hostname: redis

    image: redis:8

    container_name: investment-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - investment-network


  ###########################################################
  # Backend
  ###########################################################
  backend:

    hostname: backend

    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: investment-backend

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./backend:/opt/investment-os
      - backend_venv:/opt/investment-os/.venv
      - ./models:/models:ro


    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
#      interval: 10s
#      timeout: 5s
#      retries: 5

    networks:
      - investment-network


  ###########################################################
  # Frontend
  ###########################################################
  frontend:

    hostname: frontend

    build:
      context: ./frontend

    container_name: investment-frontend

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./frontend:/opt/investment-os
      - frontend_node_modules:/opt/investment-os/node_modules

    ports:
      - "3000:3000"

    depends_on:
        backend:
          condition: service_started


#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:3000"]
#      interval: 10s
#      timeout: 5s
#      retries: 5

    networks:
      - investment-network


###########################################################
# Volumes
###########################################################

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  backend_venv:


###########################################################
# Network
###########################################################

networks:

  investment-network:
    driver: bridge
